# Zabbix agent 2 settings for DC01 - merge into "C:\Program Files\Zabbix Agent 2\zabbix_agent2.conf"
# then: Restart-Service "Zabbix Agent 2"     (see docs/04-monitoring-alerting.md)

Server=10.10.10.20
ServerActive=10.10.10.20
Hostname=DC01
# PowerShell-backed items need more than the 3-second default.
Timeout=15

# DHCP scope health (catches the DhcpScopeDown scenario that service monitoring alone misses):
#   dhcp.scope.state[10.10.10.0] -> Active | InActive
#   dhcp.scope.free[10.10.10.0]  -> number of free addresses
UserParameter=dhcp.scope.state[*],powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "(Get-DhcpServerv4Scope -ScopeId $1).State"
UserParameter=dhcp.scope.free[*],powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "(Get-DhcpServerv4ScopeStatistics -ScopeId $1).Free"

# Item keys used by the custom triggers (built-in agent keys, no UserParameter needed):
#   service.info[DHCPServer,state]   0 = running, 6 = stopped            -> trigger severity High (P2)
#   service.info[DNS,state]          DNS Server service                  -> trigger severity High (P2)
#   service.info[NTDS,state]         Active Directory Domain Services    -> trigger severity Disaster (P1)
#   net.tcp.listen[389]              LDAP listening                      -> trigger severity High
